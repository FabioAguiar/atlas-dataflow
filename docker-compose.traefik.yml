# Production Traefik routing definition for the public web service.
#
# Current state:
# - Routing is enabled (traefik.enable: "true"): the HTTP router redirects to
#   HTTPS and the HTTPS router serves the internal web container port 80.
# - The web service must also be attached to the external `coolify` network
#   through docker-compose.coolify-network.yml.
# - No host port is published by this override.
# - The Atlas-only HSTS middleware is attached to the HTTPS router only, with
#   includeSubDomains and preload intentionally disabled.
#
# These labels are source configuration only; they do not prove that the live
# Traefik router, DNS or certificate is healthy.

services:
  web:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"

      # HTTP -> HTTPS
      traefik.http.middlewares.atlas-dataflow-redirect-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.atlas-dataflow-redirect-https.redirectscheme.permanent: "true"

      # Atlas-only HSTS policy. Keep includeSubDomains and preload disabled.
      traefik.http.middlewares.atlas-dataflow-hsts.headers.stsSeconds: "31536000"

      traefik.http.routers.atlas-dataflow-http.entrypoints: "http"
      traefik.http.routers.atlas-dataflow-http.rule: "Host(`atlas-dataflow.fabioaguiar.dev`)"
      traefik.http.routers.atlas-dataflow-http.middlewares: "atlas-dataflow-redirect-https"
      traefik.http.routers.atlas-dataflow-http.service: "atlas-dataflow-web"

      # HTTPS
      traefik.http.routers.atlas-dataflow-https.entrypoints: "https"
      traefik.http.routers.atlas-dataflow-https.rule: "Host(`atlas-dataflow.fabioaguiar.dev`)"
      traefik.http.routers.atlas-dataflow-https.tls: "true"
      traefik.http.routers.atlas-dataflow-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.atlas-dataflow-https.middlewares: "atlas-dataflow-hsts"
      traefik.http.routers.atlas-dataflow-https.service: "atlas-dataflow-web"

      # Internal container port only.
      traefik.http.services.atlas-dataflow-web.loadbalancer.server.port: "80"
