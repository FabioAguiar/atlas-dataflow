[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-dataflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jsonschema>=4.20.0",
    # M51-01: local Supabase access-token verification (JWKS-backed
    # ES256/RS256 signature and claim validation for the Admin operator).
    "PyJWT[crypto]>=2.8.0,<3",
    # Atlas-wide serving policy: the runtime pins the exact library versions
    # of the controlled Atlas training environment, so every release's
    # serialized model loads under the same joblib serializer version its
    # training-parameter-record.json records and under the scikit-learn/
    # pandas versions it was trained with (no
    # sklearn.exceptions.InconsistentVersionWarning). Changing a pin is a
    # training-environment change that must be re-verified against every
    # active release's model artifact, not against a single dataset.
    "joblib==1.5.3",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
]
