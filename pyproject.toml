[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-dataflow"
version = "0.0.0"
description = "Minimal editable package boundary for Atlas DataFlow notebook pipeline helpers."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Offline Scientific Reproduction of univariate forecasting studies
# (pipeline/forecasting_models.py executes the statsmodels constructors a
# Dataset Study declares). Never part of the serving API image, which is built
# from api/pyproject.toml. A study's full lock is provenance only: the
# reproduction runtime is classified against the contract's core packages, so
# this range only admits the minor line the pinned contract is compatible with.
scientific-forecasting = ["statsmodels>=0.15,<0.16"]
# Direct test-only tools of the repository test suite. Application/API runtime
# dependencies are NOT repeated here: they stay owned by api/pyproject.toml and
# the scientific-forecasting extra above. The canonical, exactly pinned test
# environment is compiled from all three by requirements-test.in into
# requirements-test.lock.txt (see docs/operations/application-release-gate.md).
test = [
  "pytest>=8.3,<10",
  # fastapi.testclient transport
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  # live Postgres reservation tests (tests/supabase); they still skip unless a
  # database is provided, but psycopg itself must be importable
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
exclude = [
  "api*",
  "web*",
  "notebooks*",
  "data*",
  "releases*",
  "publisher*",
  "registry*",
  "context-packs*",
  "controls*",
  "evidence*",
  "runtime*",
  "volumes*",
  "logs*",
]
namespaces = true
