name: atlas-dataflow-prod

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      ATLAS_ADMIN_ENABLED: ${ATLAS_ADMIN_ENABLED:-false}
      # M52-02: dedicated backend-only shared credential for the public
      # inference route, distinct from every Supabase and Admin credential and
      # injected by trusted configuration. Empty makes the backend reject every
      # public inference request. Never pass it to web/ or any VITE_ variable.
      ATLAS_INFERENCE_GATEWAY_TOKEN: ${ATLAS_INFERENCE_GATEWAY_TOKEN:-}
      ATLAS_MEDIA_ROOT: /app/media
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    read_only: true
    volumes:
      - ./media/home-cards:/app/media/home-cards
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-false}
        # M52-01: publishable by definition (inlined into the public bundle).
        # Empty means the visitor session reports unavailable/not_configured.
        # External prerequisite: Anonymous Auth must be enabled on the hosted
        # Supabase project; this repository cannot perform or verify that.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      api:
        condition: service_healthy
