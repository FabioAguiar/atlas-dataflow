server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    # HTTPS/WSS connect sources support the build-time-configured self-hosted
    # Supabase origin. unsafe-inline is limited to styles because the current
    # React UI and Turnstile container use inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src 'self' https: wss:; frame-src https://challenges.cloudflare.com; form-action 'self'" always;

    location = /api {
        return 308 /api/;
    }

    location = /api/admin {
        return 404;
    }

    location ^~ /api/admin/ {
        return 404;
    }

    location = /api/docs {
        return 404;
    }

    location ^~ /api/docs/ {
        return 404;
    }

    location = /api/redoc {
        return 404;
    }

    location ^~ /api/redoc/ {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/home-cards/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
