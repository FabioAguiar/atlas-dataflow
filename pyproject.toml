[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-dataflow"
version = "0.0.0"
description = "Minimal editable package boundary for Atlas DataFlow notebook pipeline helpers."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
exclude = [
  "api*",
  "web*",
  "notebooks*",
  "data*",
  "releases*",
  "publisher*",
  "registry*",
  "context-packs*",
  "controls*",
  "evidence*",
  "runtime*",
  "volumes*",
  "logs*",
]
namespaces = true
