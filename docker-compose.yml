name: atlas-dataflow

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      ATLAS_ADMIN_ENABLED: ${ATLAS_ADMIN_ENABLED:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    ports:
      - "127.0.0.1:${ATLAS_PREVIEW_PORT:-15174}:80"
    depends_on:
      api:
        condition: service_healthy
