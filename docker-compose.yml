name: atlas-dataflow

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      ATLAS_ADMIN_ENABLED: ${ATLAS_ADMIN_ENABLED:-true}
      # Internal legacy-compatible value only; first-version admin access is
      # governed by the private runtime and loopback/SSH-tunneled access.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_RUNS_ROOT: ${ADMIN_RUNS_ROOT:-/app/publisher/runs}
      ATLAS_MEDIA_ROOT: /app/media
    expose:
      - "8000"
    volumes:
      - ./contracts:/app/contracts:ro
      - ./publisher/runs:/app/publisher/runs
      - ./releases:/app/releases
      - ./registry:/app/registry
      - ./media/home-cards:/app/media/home-cards
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-true}
    command:
      - /bin/sh
      - -c
      - |
        cat >/etc/nginx/conf.d/default.conf <<'NGINX_CONF'
        server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            location = /api {
                return 308 /api/;
            }

            location = /api/admin {
                proxy_pass http://api:8000/admin;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location ^~ /api/admin/ {
                client_max_body_size 11m;
                proxy_pass http://api:8000/admin/;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location /api/ {
                proxy_pass http://api:8000/;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location ^~ /media/home-cards/ {
                proxy_pass http://api:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location / {
                try_files $$uri $$uri/ /index.html;
            }
        }
        NGINX_CONF
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:${ATLAS_PREVIEW_PORT:-15174}:80"
    depends_on:
      api:
        condition: service_healthy
