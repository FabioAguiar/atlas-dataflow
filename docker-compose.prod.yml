name: atlas-dataflow-prod

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      ATLAS_ADMIN_ENABLED: ${ATLAS_ADMIN_ENABLED:-false}
      ATLAS_MEDIA_ROOT: /app/media
    expose:
      - "8000"
    volumes:
      - ./media/home-cards:/app/media/home-cards
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  external-inference:
    build:
      context: .
      dockerfile: external-inference/Dockerfile
    environment:
      EXTERNAL_INFERENCE_HOST: ${EXTERNAL_INFERENCE_HOST:-0.0.0.0}
      EXTERNAL_INFERENCE_PORT: ${EXTERNAL_INFERENCE_PORT:-8100}
    expose:
      - "8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/live', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_ADMIN: ${VITE_ENABLE_ADMIN:-false}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
